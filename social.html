
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>

    <style>
        /* GENERAL */
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* HEADER */
        h1 {
            margin-top: 35px;
            font-size: 40px;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            width: 100%;
            background-color: #555555;
            border-radius: 8px;
        }

        nav a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: white;
            background: linear-gradient(to bottom, #777777, #444444);
            padding: 20px 0;
            font-size: 25px;
            transition: 0.3s;
        }

        nav a:hover {
            background: linear-gradient(to bottom, #990000, #660000);
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* CHARACTER SLOTS */
        .character-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .character {
            width: 150px;
            height: 170px;
            background-color: #222222;
            border: 3px solid #555555;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            overflow: hidden;
        }

        .character:hover {
            border-color: #990000;
        }

        .character.selected {
            border-color: #cc0000;
        }

        .character img {
            width: 100%;
            height: 125px;
            object-fit: contain;
            margin-top: 5px;
        }

        .character p {
            margin: 8px 0;
            font-size: 16px;
        }

        /* CHARACTER PREVIEW */
        .preview {
            background-color: #171717;
            border: 2px solid #555555;
            border-radius: 10px;
            padding: 25px;
            max-width: 600px;
            margin: auto;
        }

        .preview img {
            width: 220px;
            height: 260px;
            object-fit: contain;
        }

        .preview h2 {
            color: #cc0000;
            font-size: 30px;
        }

        .preview p {
            font-size: 17px;
            color: #cccccc;
        }

        /* CONFIRM BUTTON */
        button {
            background: linear-gradient(to bottom, #990000, #550000);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 15px 35px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 25px;
        }

        button:hover {
            background: #bb0000;
        }

        #confirmation {
            margin-top: 20px;
            color: #cc0000;
            font-size: 20px;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }

            .character {
                width: 120px;
            }

            .preview img {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="characters.html">Characters</a>
    </nav>

    <h1>CHARACTER SELECTION</h1>
    <p>Choose your character.</p>

    <div class="container">

        <!-- CHARACTER LIST -->
        <div class="character-list">

            <div class="character selected" onclick="selectCharacter(0)">
                <img src="characters/character1.png">
                <p>Character 1</p>
            </div>

            <div class="character" onclick="selectCharacter(1)">
                <img src="characters/character2.png">
                <p>Character 2</p>
            </div>

            <div class="character" onclick="selectCharacter(2)">
                <img src="characters/character3.png">
                <p>Character 3</p>
            </div>

            <div class="character" onclick="selectCharacter(3)">
                <img src="characters/character4.png">
                <p>Character 4</p>
            </div>

            <div class="character" onclick="selectCharacter(4)">
                <img src="characters/character5.png">
                <p>Character 5</p>
            </div>

        </div>

        <!-- CHARACTER PREVIEW -->
        <div class="preview">

            <img id="previewImage" src="characters/character1.png">

            <h2 id="characterName">Character 1</h2>

            <p id="characterDescription">
                Description of Character 1 goes here.
            </p>

            <button onclick="confirmSelection()">
                Confirm Selection
            </button>

            <p id="confirmation"></p>

        </div>

    </div>

    <script>

        // CHARACTER INFORMATION
        const characters = [
            {
                name: "Character 1",
                image: "characters/character1.png",
                description: "Description of Character 1 goes here."
            },
            {
                name: "Character 2",
                image: "characters/character2.png",
                description: "Description of Character 2 goes here."
            },
            {
                name: "Character 3",
                image: "characters/character3.png",
                description: "Description of Character 3 goes here."
            },
            {
                name: "Character 4",
                image: "characters/character4.png",
                description: "Description of Character 4 goes here."
            },
            {
                name: "Character 5",
                image: "characters/character5.png",
                description: "Description of Character 5 goes here."
            }
        ];

        let selectedCharacter = 0;

        // SELECT CHARACTER
        function selectCharacter(index) {

            selectedCharacter = index;

            const character = characters[index];

            document.getElementById("previewImage").src = character.image;
            document.getElementById("characterName").textContent = character.name;
            document.getElementById("characterDescription").textContent = character.description;

            document.getElementById("confirmation").textContent = "";

            const slots = document.querySelectorAll(".character");

            slots.forEach((slot, i) => {
                slot.classList.toggle("selected", i === index);
            });
        }

        // CONFIRM SELECTION
        function confirmSelection() {

            const character = characters[selectedCharacter];

            localStorage.setItem("selectedCharacter", JSON.stringify(character));

            document.getElementById("confirmation").textContent =
                "You selected " + character.name + "!";

        }

    </script>

</body>
</html>
