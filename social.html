
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Select</title>

<style>

/* GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header {
    text-align: center;
    padding: 25px;
    font-size: 32px;
    letter-spacing: 5px;
    background: #111;
    border-bottom: 2px solid #660000;
}

/* MAIN LAYOUT */

.selection-screen {
    display: flex;
    min-height: 85vh;
    align-items: center;
    justify-content: space-around;
    padding: 30px;
}

/* CHARACTER DISPLAY */

.character-display {
    width: 65%;
    height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.character-display img {
    max-width: 95%;
    max-height: 100%;
    object-fit: contain;
    position: absolute;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
}

.character-display img.active {
    opacity: 1;
}

/* CHARACTER ROSTER */

.roster {
    width: 300px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    border: 2px solid #333;
}

/* CHARACTER OPTIONS */

.character-option {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border: 1px solid #292929;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.15s;
}

.character-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(70%) brightness(0.7);
    transition: 0.2s;
}

.character-option:hover {
    border: 2px solid #a00000;
    z-index: 2;
}

.character-option:hover img {
    filter: grayscale(0%) brightness(1);
}

/* EMPTY SLOT */

.empty-slot {
    background: #080808;
    border: 1px solid #292929;
}

/* CHARACTER NAME */

.character-name {
    position: absolute;
    bottom: 20px;
    left: 40px;
    font-size: 32px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 2px 2px 5px black;
}

/* MOBILE */

@media (max-width: 750px) {

    .selection-screen {
        flex-direction: column;
        padding: 10px;
    }

    .character-display {
        width: 100%;
        height: 55vh;
    }

    .roster {
        width: 90%;
        max-width: 350px;
    }

    .character-name {
        font-size: 22px;
        left: 15px;
        bottom: 10px;
    }

}

</style>
</head>

<body>

<header>
    CHARACTER SELECT
</header>

<div class="selection-screen">

    <!-- LARGE CHARACTER PREVIEW -->

    <div class="character-display">

        <img src="characters/character1.png"
             class="active" id="preview1">

        <img src="characters/character2.png"
             id="preview2">

        <img src="characters/character3.png"
             id="preview3">

        <img src="characters/character4.png"
             id="preview4">

        <img src="characters/character5.png"
             id="preview5">

        <div class="character-name" id="characterName">
            Character 1
        </div>

    </div>


    <!-- CHARACTER ROSTER -->

    <div class="roster">

        <div class="character-option"
             onmouseenter="showCharacter(1)">
            <img src="characters/character1.png">
        </div>

        <div class="character-option"
             onmouseenter="showCharacter(2)">
            <img src="characters/character2.png">
        </div>

        <div class="character-option"
             onmouseenter="showCharacter(3)">
            <img src="characters/character3.png">
        </div>

        <div class="character-option"
             onmouseenter="showCharacter(4)">
            <img src="characters/character4.png">
        </div>

        <div class="character-option"
             onmouseenter="showCharacter(5)">
            <img src="characters/character5.png">
        </div>

        <!-- EMPTY SIXTH SLOT -->

        <div class="empty-slot"></div>

    </div>

</div>


<script>

// CHARACTER NAMES

const names = [
    "Character 1",
    "Character 2",
    "Character 3",
    "Character 4",
    "Character 5"
];

// CHANGE CHARACTER PREVIEW

function showCharacter(number) {

    // Hide every character
    document.querySelectorAll(".character-display img")
        .forEach(image => {
            image.classList.remove("active");
        });

    // Show selected character
    document.getElementById("preview" + number)
        .classList.add("active");

    // Update character name
    document.getElementById("characterName").textContent =
        names[number - 1];

}

</script>

</body>
</html>
