
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Select</title>

<style>

/* GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header {
    text-align: center;
    padding: 25px;
    font-size: 32px;
    letter-spacing: 5px;
    background: #111;
    border-bottom: 2px solid #660000;
}

/* MAIN LAYOUT */

.selection-screen {
    display: flex;
    min-height: 85vh;
    align-items: center;
    justify-content: space-around;
    padding: 30px;
    gap: 30px;
}

/* CHARACTER DISPLAY */

.character-display {
    position: relative;
    width: 65%;
    height: 85vh;
    flex: 1;
    align-self: flex-end;
}

.character-display img {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;

    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
}

.character-display img.active {
    opacity: 1;
}

/* CHARACTER NAME */

.character-name {
    position: absolute;
    bottom: 20px;
    left: 40px;
    font-size: 32px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 2px 2px 5px black;
    z-index: 3;
}

/* CHARACTER ROSTER */

.roster {
    width: 300px;
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
}

/* CHARACTER OPTIONS */

.character-option {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border: 1px solid #292929;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.15s;
}

.character-option:nth-child(odd) {
    transform: translateY(50%);
}

.character-option img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 3px;
    filter: grayscale(70%) brightness(0.7);
    transition: 0.2s;
}

.character-option:hover,
.character-option.selected {
    outline: 2px solid #a00000;
    z-index: 2;
}

.character-option:hover img,
.character-option.selected img {
    filter: grayscale(0%) brightness(1);
}

/* EMPTY SLOT */

.empty-slot {
    background: #080808;
    border: 1px solid #292929;
    aspect-ratio: 1 / 1;
}

/* BOTTOM BAR */

.bottom-bar {
    width: 100%;
    min-height: 165px;
    background: #111;
    border-top: 2px solid #800000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 40px;
    color: white;
    font-size: 16px;
    letter-spacing: 3px;
}

/* MUSIC CONTROLS */

.music-container {
    text-align: center;
}

.music-button {
    background: #180000;
    border: 2px solid #800000;
    color: white;
    padding: 15px 25px;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.2s;
}

.music-button:hover {
    background: #800000;
}

.music-button:active {
    transform: scale(0.96);
}

.music-status {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
    text-align: center;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 750px) {

    .selection-screen {
        flex-direction: column;
        padding: 10px;
        gap: 20px;
    }

    .character-display {
        width: 100%;
        height: 55vh;
        flex: none;
    }

    .roster {
        width: 90%;
        max-width: 350px;
    }

    .character-name {
        font-size: 22px;
        left: 15px;
        bottom: 10px;
    }

    .bottom-bar {
        padding: 20px 15px;
        font-size: 12px;
        letter-spacing: 2px;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    header {
        font-size: 23px;
    }

    .music-button {
        padding: 15px 25px;
        min-height: 48px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>
    CHARACTER SELECT
</header>


<!-- MAIN SELECTION SCREEN -->

<div class="selection-screen">

    <!-- LARGE CHARACTER PREVIEW -->

    <div class="character-display">

        <img src="character11.png"
             class="active"
             id="preview1"
             alt="Character 1">

        <img src="Stamoulović11.png"
             id="preview2"
             alt="Stamoulović">

        <img src="Doudoukass11.png"
             id="preview3"
             alt="Doudoukass">

        <img src="characters/character4.png"
             id="preview4"
             alt="Character 4">

        <img src="characters/character5.png"
             id="preview5"
             alt="Character 5">

        <div class="character-name" id="characterName">
            Character 1
        </div>

    </div>


    <!-- CHARACTER ROSTER -->

    <div class="roster">

        <div class="character-option selected"
             data-character="1">

            <img src="character1.png" alt="Character 1">

        </div>

        <div class="character-option"
             data-character="2">

            <img src="Stamoulović10.png" alt="Stamoulović">

        </div>

        <div class="character-option"
             data-character="3">

            <img src="Doudoukass1.png" alt="Doudoukass">

        </div>

        <div class="character-option"
             data-character="4">

            <img src="Georgakas10.png" alt="Georgakas">

        </div>

        <div class="character-option"
             data-character="5">

            <img src="characters/character5.png" alt="Character 5">

        </div>

        <div class="empty-slot"></div>

    </div>

</div>


<!-- BOTTOM BAR -->

<div class="bottom-bar">

    <span>SELECTED CHARACTER</span>

    <span>OPTIONS</span>

    <div class="music-container">

        <button
            class="music-button"
            id="musicButton"
            type="button">

            ▶ PLAY MUSIC

        </button>

        <div class="music-status" id="musicStatus">
            MUSIC READY
        </div>

    </div>

</div>


<!-- CHARACTER SWITCH SOUND -->

<audio
    id="switchSound"
    src="charswitch.mp3"
    preload="auto">
</audio>


<!-- BACKGROUND MUSIC -->

<audio
    id="backgroundMusic"
    preload="none"
    loop
    playsinline>
</audio>


<script>

document.addEventListener("DOMContentLoaded", function() {


/* =====================================
   CHARACTER INFORMATION
===================================== */

const names = [
    "Character 1",
    "Stamoulović",
    "Doudoukass",
    "Character 4",
    "Character 5"
];

let currentCharacter = 1;

const switchSound =
    document.getElementById("switchSound");

const backgroundMusic =
    document.getElementById("backgroundMusic");

const musicButton =
    document.getElementById("musicButton");

const musicStatus =
    document.getElementById("musicStatus");

const options =
    document.querySelectorAll(".character-option");


/* =====================================
   CHARACTER SWITCH SOUND
===================================== */

function playSwitchSound() {

    switchSound.currentTime = 0;

    switchSound.play().catch(function(error) {

        console.log("Switch sound unavailable:", error);

    });

}


/* =====================================
   CHANGE CHARACTER
===================================== */

function showCharacter(number) {

    if (number < 1 || number > names.length) {
        return;
    }

    if (number === currentCharacter) {
        return;
    }

    currentCharacter = number;

    playSwitchSound();


    // Hide all character previews

    document.querySelectorAll(".character-display img")
        .forEach(function(image) {

            image.classList.remove("active");

        });


    // Show selected preview

    const preview =
        document.getElementById("preview" + number);

    if (preview) {

        preview.classList.add("active");

    }


    // Update character name

    document.getElementById("characterName").textContent =
        names[number - 1];


    // Update selected portrait

    options.forEach(function(option) {

        option.classList.toggle(
            "selected",
            Number(option.dataset.character) === number
        );

    });

}


/* =====================================
   MOUSE HOVER NAVIGATION
===================================== */

options.forEach(function(option) {

    option.addEventListener("mouseenter", function() {

        showCharacter(
            Number(option.dataset.character)
        );

    });

});


/* =====================================
   CLICK AND TOUCH NAVIGATION
===================================== */

options.forEach(function(option) {

    option.addEventListener("click", function() {

        showCharacter(
            Number(option.dataset.character)
        );

    });

});


/* =====================================
   KEYBOARD NAVIGATION
===================================== */

document.addEventListener("keydown", function(event) {

    let next = currentCharacter;

    switch(event.key) {

        case "ArrowRight":

            if (currentCharacter % 2 === 1) {

                next = currentCharacter + 1;

            }

            break;


        case "ArrowLeft":

            if (currentCharacter % 2 === 0) {

                next = currentCharacter - 1;

            }

            break;


        case "ArrowDown":

            next = currentCharacter + 2;

            break;


        case "ArrowUp":

            next = currentCharacter - 2;

            break;


        default:

            return;

    }

    event.preventDefault();

    if (next >= 1 && next <= names.length) {

        showCharacter(next);

    }

});


/* =====================================
   BACKGROUND MUSIC SYSTEM
===================================== */

// This is the original filename.
// The file must be in the SAME folder as index.html.

const musicFilename =
    "Evol Intent, Mayhem & Thinktank - Broken Sword - NfS Most Wanted Soundtrack - 1080p.mp3";

// Encode the filename safely for GitHub Pages.

backgroundMusic.src = encodeURIComponent(musicFilename);

backgroundMusic.volume = 0.3;


/* =====================================
   MUSIC BUTTON
===================================== */

let musicIsLoading = false;

musicButton.addEventListener("click", async function() {

    // Prevent repeated clicks while loading

    if (musicIsLoading) {
        return;
    }


    // Pause music if it is already playing

    if (!backgroundMusic.paused) {

        backgroundMusic.pause();

        return;

    }


    // Start loading

    musicIsLoading = true;

    musicButton.textContent = "LOADING...";

    musicStatus.textContent = "LOADING MUSIC...";


    try {

        // IMPORTANT:
        // Call play() directly from the button interaction.
        // Do not call load() here.

        await backgroundMusic.play();

        musicButton.textContent = "⏸ PAUSE MUSIC";

        musicStatus.textContent = "NOW PLAYING";

    }

    catch(error) {

        console.error("Background music error:", error);

        musicButton.textContent = "▶ PLAY MUSIC";

        musicStatus.textContent =
            "PLAYBACK FAILED: " + error.message;

    }

    finally {

        musicIsLoading = false;

    }

});


/* =====================================
   MUSIC EVENT HANDLERS
===================================== */

backgroundMusic.addEventListener("playing", function() {

    musicButton.textContent = "⏸ PAUSE MUSIC";

    musicStatus.textContent = "NOW PLAYING";

});


backgroundMusic.addEventListener("pause", function() {

    musicButton.textContent = "▶ PLAY MUSIC";

    musicStatus.textContent = "MUSIC PAUSED";

});


backgroundMusic.addEventListener("waiting", function() {

    musicStatus.textContent = "BUFFERING...";

});


backgroundMusic.addEventListener("error", function() {

    const errorCode =
        backgroundMusic.error
            ? backgroundMusic.error.code
            : "UNKNOWN";

    console.error(
        "Audio loading error:",
        errorCode,
        backgroundMusic.currentSrc
    );

    musicButton.textContent = "▶ PLAY MUSIC";

    musicStatus.textContent =
        "AUDIO ERROR: " + errorCode;

});


/* =====================================
   INITIAL STATE
===================================== */

musicButton.textContent = "▶ PLAY MUSIC";

musicStatus.textContent = "MUSIC READY";


});

</script>

</body>
</html>
