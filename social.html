
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Select</title>

<style>

/* GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000000;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header {
    text-align: center;
    padding: 25px;
    font-size: 32px;
    letter-spacing: 5px;
    background: #111;
    border-bottom: 2px solid #660000;
}

/* MAIN LAYOUT */

.selection-screen {
    display: flex;
    min-height: 85vh;
    align-items: center;
    justify-content: space-around;
    padding: 30px;
}

/* CHARACTER DISPLAY */

.character-display img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
}

.character-display img.active {
    opacity: 1;
}
/* CHARACTER ROSTER */

.roster {
    width: 300px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    border: none;
}

/* CHARACTER OPTIONS */

.character-option {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border: 1px solid #292929;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.15s;
}

/* LEFT COLUMN OFFSET */

.character-option:nth-child(odd) {
    transform: translateY(50%);
}

/* PORTRAIT IMAGES */

.character-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(70%) brightness(0.7);
    transition: 0.2s;
}

/* HOVER AND SELECTION */

.character-option:hover,
.character-option.selected {
    outline: 2px solid #a00000;
    z-index: 2;
}

.character-option:hover img,
.character-option.selected img {
    filter: grayscale(0%) brightness(1);
}

/* EMPTY SLOT */

.empty-slot {
    background: #080808;
    border: 1px solid #292929;
}

/* CHARACTER NAME */

.character-name {
    position: absolute;
    bottom: 20px;
    left: 40px;
    font-size: 32px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 2px 2px 5px black;
}

/* MOBILE */

@media (max-width: 750px) {

    .selection-screen {
        flex-direction: column;
        padding: 10px;
    }

    .character-display {
        width: 100%;
        height: 55vh;
    }

    .roster {
        width: 90%;
        max-width: 350px;
    }

    .character-name {
        font-size: 22px;
        left: 15px;
        bottom: 10px;
    }

}

</style>
    .bottom-bar {
    width: 100%;
    height: 55px;
    background: #111;
    border-top: 2px solid #800000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    color: white;
    font-size: 16px;
    letter-spacing: 3px;
}
</head>

<body>

<header>
    CHARACTER SELECT
</header>

<div class="selection-screen">

    <!-- LARGE CHARACTER PREVIEW -->

    <div class="character-display">

        <img src="character11.png"
             class="active" id="preview1">

        <img src="Stamoulović11.png"
             id="preview2">

        <img src="characters/character3.png"
             id="preview3">

        <img src="characters/character4.png"
             id="preview4">

        <img src="characters/character5.png"
             id="preview5">

        <div class="character-name" id="characterName">
            Character 1
       </div> <!-- End of selection-screen -->

    <div>
    
</div>
        
    

    <!-- CHARACTER ROSTER -->

    <div class="roster">

        <div class="character-option selected">
            <img src="character1.png" alt="Character 1">
        </div>

        <div class="character-option">
            <img src="Stamoulović1.png" alt="Character 2">
        </div>

        <div class="character-option">
            <img src="characters/character3.png" alt="Character 3">
        </div>

        <div class="character-option">
            <img src="characters/character4.png" alt="Character 4">
        </div>

        <div class="character-option">
            <img src="characters/character5.png" alt="Character 5">
        </div>

        <!-- EMPTY SIXTH SLOT -->

        <div class="empty-slot"></div>

    </div>

</div>


<script>

/* CHARACTER INFORMATION */

const names = [
    "Character 1",
    "Stamoulović",
    "Character 3",
    "Character 4",
    "Character 5"
];

let currentCharacter = 1;


/* CHANGE CHARACTER PREVIEW */

function showCharacter(number) {

    if (number < 1 || number > 5) return;

    currentCharacter = number;

    // Hide all previews
    document.querySelectorAll(".character-display img")
        .forEach(image => {
            image.classList.remove("active");
        });

    // Show selected character
    document.getElementById("preview" + number)
        .classList.add("active");

    // Update character name
    document.getElementById("characterName").textContent =
        names[number - 1];

    // Update highlighted portrait
    document.querySelectorAll(".character-option")
        .forEach((option, index) => {
            option.classList.toggle(
                "selected",
                index === number - 1
            );
        });
}


/* MOUSE NAVIGATION */

document.querySelectorAll(".character-option")
    .forEach((option, index) => {

        option.addEventListener("mouseenter", () => {
            showCharacter(index + 1);
        });

    });


/* KEYBOARD NAVIGATION */

document.addEventListener("keydown", function(event) {

    let next = currentCharacter;

    switch(event.key) {

        case "ArrowRight":
            next = currentCharacter % 2 === 1
                ? currentCharacter + 1
                : currentCharacter;
            break;

        case "ArrowLeft":
            next = currentCharacter % 2 === 0
                ? currentCharacter - 1
                : currentCharacter;
            break;

        case "ArrowDown":
            next = currentCharacter + 2;
            break;

        case "ArrowUp":
            next = currentCharacter - 2;
            break;

        default:
            return;
    }

    event.preventDefault();

    if (next >= 1 && next <= 5) {
        showCharacter(next);
    }

});

</script>

</body>
</html>
