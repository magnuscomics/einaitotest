<!DOCTYPE html>
<html>
<head>
  <title>Home</title>

<style>

/* --- Body --- */
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: #000000;
    color: #ffffff;
    margin: 0;
    padding: 0;
}

/* --- Header --- */
.header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 10px;
    margin-bottom: 10px;
    min-height: 220px;
}

#topGif {
    position: absolute;
    left: 10px;
    top: 10px;
    width: 200px;
}

#titleImage {
    width: 300px;
}

/* --- NAV --- */
nav {
    display: flex;
    width: 100%;
    background-color: #555555;
    border-radius: 8px;
}

/* Buttons */
nav a, .dropbtn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    color: #ffffff;
    background: linear-gradient(to bottom, #777777, #444444);
    padding: 25px 0;
    font-size: 36px;
    transition: 0.3s;
    nav a, .dropbtn
}

/* Hover */
nav a:hover, .dropbtn:hover {
    background: linear-gradient(to bottom, #990000, #660000);
}

/* Rounded edges */
nav a:first-child {
    border-top-left-radius: 8px;
    border-bottom-left-radius: 8px;
}
nav a:last-child {
    border-top-right-radius: 8px;
    border-bottom-right-radius: 8px;
}

/* --- DROPDOWN --- */
.dropdown {
    position: relative;
    flex: 1;
}

/* Hidden menu */
.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background-color: white;
    z-index: 999;
    flex-direction: column;
}

/* Items */
.dropdown-content a {
    display: block;
    padding: 12px;
    color: black;
    text-decoration: none;
}

.dropdown-content a:hover {
    background-color: #eeeeee;
}

/* Show dropdown */
.dropdown:hover .dropdown-content {
    display: flex;
}

/* --- Images --- */
img {
    max-width: 90%;
    height: auto;
}

/* --- Mobile --- */
@media (max-width: 600px) {
    nav {
        flex-direction: column;
    }

    nav a, .dropbtn {
        padding: 40px 0;
        font-size: 50px;
    }

    img {
        width: 100%;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <img src="sprite_0..gif" id="topGif" draggable="false">
    <img src="title.png" id="titleImage" draggable="false">
</div>

<!-- NAV -->
<nav>
    <a href="index.html">Home</a>

    <div class="dropdown">
        <a class="dropbtn" href="comic1.html">Nimfes</a>
        <div class="dropdown-content">
            <a href="comic1_issue1.html">Issue 1</a>
            <a href="comic1_issue2.html">Issue 2</a>
        </div>
    </div>

    <a href="comic2.html">DND</a>
    <a href="social.html">Social</a>
</nav>

<img src="home.png" width="800" draggable="false">

<script>
document.addEventListener("contextmenu", function(e) {
    if (e.target.tagName === "IMG") {
        e.preventDefault();
    }
});
</script>

</body>
</html>
